name: Recipe collage skill tests
on:
  push:
    paths:
      - "skills/real-photo-recipe-collage/**"
      - ".github/workflows/recipe-collage-tests.yml"
  pull_request:
    paths:
      - "skills/real-photo-recipe-collage/**"
      - ".github/workflows/recipe-collage-tests.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chinese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: python -m pip install -r skills/real-photo-recipe-collage/requirements.txt
      - name: Run tests (synthetic files only)
        run: python -m unittest discover -s skills/real-photo-recipe-collage/tests -v
